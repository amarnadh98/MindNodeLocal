name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: swift test (${{ matrix.package }})
    runs-on: xcode-27
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          - MapCore
          - MapLayout
          - MapRender
          - MapIO
          - MapStudy
          - MapAI
          - MapLibrary
          - MapAutomation
          - CanvasKit
          - ArborUI
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path Packages/${{ matrix.package }}

  lint:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Job time limits
        run: scripts/ci/check-job-timeouts.sh
      - name: swift-format
        run: |
          swift format lint --strict --configuration .swift-format -r Packages
          swift format lint --strict --configuration .swift-format -r App
          swift format lint --strict --configuration .swift-format -r Extensions
          swift format lint --strict --configuration .swift-format -r Tools
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --no-cache

  perf:
    name: release-mode budgets
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: MapLayout release tests (10 ms budget locally; 2x guard on shared runners)
        run: swift test -c release --package-path Packages/MapLayout
      - name: CanvasKit release timings (printed only; budgets are enforced on local M1-class runs)
        run: swift test -c release --package-path Packages/CanvasKit

  xcode:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test
        run: scripts/ci/xcode-test-watchdog.sh
