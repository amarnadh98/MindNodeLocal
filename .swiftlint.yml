included:
  - Packages
  - App
  - Extensions
excluded:
  - Tests/Fixtures
  - '**/.build/**'
  - Arbor.xcodeproj
  - DerivedData
disabled_rules:
  - trailing_comma
opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - first_where
  - last_where
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - toggle_bool
  - unowned_variable_capture
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
identifier_name:
  excluded:
    - id
    - x
    - y
    - z
    - dx
    - dy
    - ok
    - on
    - in
    - at
    - to
    - by
    - i
    - j
    - k
    - n
    - ai
    - ts
    - lo
    - hi
    - up
    - dn
function_body_length:
  warning: 150
  error: 300
line_length:
  warning: 120
  error: 200
type_name:
  max_length: 1000
