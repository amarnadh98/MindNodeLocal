name: Arbor
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  MapCore:
    path: Packages/MapCore
  MapLayout:
    path: Packages/MapLayout
  MapRender:
    path: Packages/MapRender
  CanvasKit:
    path: Packages/CanvasKit
  MapStudy:
    path: Packages/MapStudy
  MapIO:
    path: Packages/MapIO
  MapLibrary:
    path: Packages/MapLibrary
  MapAI:
    path: Packages/MapAI
  # SPEC §13 in-app updates; runtime dependency 1 of 8 (SPEC §11.1,
  # ADR-0021). Linked into the app target only.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    # F-STY-7/M2: the asset catalog's AppIcon set (generated by
    # scripts/generate_app_icon.swift).
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Arbor:
    type: application
    platform: macOS
    sources:
      - App/Sources
      # The app icon's asset catalog (F-STY-7, generated by
      # scripts/generate_app_icon.swift). App/Resources's other files
      # (Info.plist, entitlements) are build settings referenced above,
      # never bundle resources — the original `resources:` key was dead
      # config XcodeGen silently ignored; a sources entry with an
      # explicit resources phase actually copies the catalog.
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: MapCore
      - package: MapLayout
      - package: MapRender
      - package: CanvasKit
      - package: CanvasKit
        product: SceneExport
      # M6: the presentation coordinator drives the shared RevealEngine
      # directly (SPEC §10).
      - package: MapStudy
      - package: MapIO
      - package: MapLibrary
      - package: MapAI
      - package: Sparkle
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Arbor
        CFBundleName: Arbor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        # The asset catalog's icon set (AppIcon.appiconset).
        CFBundleIconName: AppIcon
        CFBundleDocumentTypes:
          - CFBundleTypeName: Arbor Map
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.arbor.map
            LSTypeIsPackage: true
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MapDocument
          # F-IO (SPEC §5.17): foreign formats open (viewer role) as new
          # untitled Arbor documents — MapDocument.read imports them and
          # untitles; the source file is never written back.
          - CFBundleTypeName: OPML Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.opml.opml
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MapDocument
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MapDocument
          - CFBundleTypeName: Plain Text Outline
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MapDocument
          - CFBundleTypeName: FreeMind / Freeplane Map
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.freemind.freemind
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MapDocument
          - CFBundleTypeName: XMind Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.xmind.xmind
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MapDocument
          - CFBundleTypeName: MindNode Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.mindnode.mindnode
            LSTypeIsPackage: true
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MapDocument
          # F-STY-5: double-clicking an .arbortheme installs it into the
          # themes folder (AppDelegate.application(open:) — no document
          # opens), so no NSDocumentClass here.
          - CFBundleTypeName: Arbor Theme
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.arbor.theme
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.arbor.map
            UTTypeDescription: Arbor Map
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - arbor
          # F-EDT-9: the internal lossless clipboard payload. Declared so
          # the flavour is a real UTI, not an anonymous pasteboard string.
          - UTTypeIdentifier: com.arbor.paste.nodes
            UTTypeDescription: Arbor Node Payload
            UTTypeConformsTo:
              - public.json
          # F-STY-5: the theme file contract (Theme Codable, ADR-0009)
          # — declared so export save panels and Finder double-click
          # installs work.
          - UTTypeIdentifier: com.arbor.theme
            UTTypeDescription: Arbor Theme
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - arbortheme
        UTImportedTypeDeclarations:
          # The pasteboard's interop text flavours (F-EDT-9).
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - markdown
                - md
          - UTTypeIdentifier: org.opml.opml
            UTTypeDescription: OPML Document
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - opml
          # F-IO import-only third-party formats nobody on the system
          # declares yet; LSHandlerRank Alternate in the document types.
          - UTTypeIdentifier: com.freemind.freemind
            UTTypeDescription: FreeMind / Freeplane Map
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - mm
          - UTTypeIdentifier: org.xmind.xmind
            UTTypeDescription: XMind Document
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - xmind
          - UTTypeIdentifier: com.mindnode.mindnode
            UTTypeDescription: MindNode Document
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - mindnode
        # SPEC §13 / ADR-0021: Sparkle in-app updates.
        SUFeedURL: https://amarnadh98.github.io/MindNodeLocal/appcast.xml
        # EdDSA public key from the SPARKLE_PUBLIC_ED_KEY build setting
        # (Config.xcconfig). Placeholder-empty until the key pair is
        # generated — see docs/release-checklist.md.
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        # Sandboxed apps install updates through Sparkle's bundled
        # Installer XPC service (Sparkle sandboxing guide).
        SUEnableInstallerLauncherService: true
        # SPEC §12: Sparkle never sends a system profile (no telemetry).
        SUEnableSystemProfiling: false
    entitlements:
      path: App/Resources/Arbor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # SPEC §12: network client — only the AI providers the user
        # configures (Settings ▸ AI), user-initiated URL imports, and
        # user-initiated update checks (ADR-0021; with this entitlement
        # Sparkle's Downloader XPC service is not needed).
        com.apple.security.network.client: true
        # Sparkle sandboxing guide: reach the Installer XPC service.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
  ArborTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - App/Tests
    dependencies:
      - target: Arbor
      # The test bundle imports the packages directly, so it links their
      # product frameworks itself instead of relying on bundle_loader
      # symbol resolution from the host executable (which stopped
      # working once the products became shared frameworks).
      - package: MapCore
      - package: MapLayout
      - package: MapRender
      - package: CanvasKit
      - package: CanvasKit
        product: SceneExport
      - package: MapStudy
      - package: MapIO
      - package: MapLibrary
      - package: MapAI
    settings:
      base:
        PRODUCT_NAME: ArborTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Arbor.app/Contents/MacOS/Arbor
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Arbor:
    build:
      targets:
        Arbor: all
    test:
      targets:
        - ArborTests
