name: Arbor
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  MapCore:
    path: Packages/MapCore
  MapLayout:
    path: Packages/MapLayout
  MapRender:
    path: Packages/MapRender
  CanvasKit:
    path: Packages/CanvasKit
  MapIO:
    path: Packages/MapIO
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  Arbor:
    type: application
    platform: macOS
    sources:
      - App/Sources
    resources:
      - path: App/Resources
    dependencies:
      - package: MapCore
      - package: MapLayout
      - package: MapRender
      - package: CanvasKit
      - package: CanvasKit
        product: SceneExport
      - package: MapIO
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Arbor
        CFBundleName: Arbor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Arbor Map
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.arbor.map
            LSTypeIsPackage: true
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MapDocument
          # F-IO (SPEC §5.17): foreign formats open (viewer role) as new
          # untitled Arbor documents — MapDocument.read imports them and
          # untitles; the source file is never written back.
          - CFBundleTypeName: OPML Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.opml.opml
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MapDocument
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MapDocument
          - CFBundleTypeName: Plain Text Outline
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MapDocument
          - CFBundleTypeName: FreeMind / Freeplane Map
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.freemind.freemind
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MapDocument
          - CFBundleTypeName: XMind Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.xmind.xmind
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MapDocument
          - CFBundleTypeName: MindNode Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.mindnode.mindnode
            LSTypeIsPackage: true
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MapDocument
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.arbor.map
            UTTypeDescription: Arbor Map
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - arbor
          # F-EDT-9: the internal lossless clipboard payload. Declared so
          # the flavour is a real UTI, not an anonymous pasteboard string.
          - UTTypeIdentifier: com.arbor.paste.nodes
            UTTypeDescription: Arbor Node Payload
            UTTypeConformsTo:
              - public.json
        UTImportedTypeDeclarations:
          # The pasteboard's interop text flavours (F-EDT-9).
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - markdown
                - md
          - UTTypeIdentifier: org.opml.opml
            UTTypeDescription: OPML Document
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - opml
          # F-IO import-only third-party formats nobody on the system
          # declares yet; LSHandlerRank Alternate in the document types.
          - UTTypeIdentifier: com.freemind.freemind
            UTTypeDescription: FreeMind / Freeplane Map
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - mm
          - UTTypeIdentifier: org.xmind.xmind
            UTTypeDescription: XMind Document
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - xmind
          - UTTypeIdentifier: com.mindnode.mindnode
            UTTypeDescription: MindNode Document
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - mindnode
    entitlements:
      path: App/Resources/Arbor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
  ArborTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - App/Tests
    dependencies:
      - target: Arbor
      # The test bundle imports the packages directly, so it links their
      # product frameworks itself instead of relying on bundle_loader
      # symbol resolution from the host executable (which stopped
      # working once the products became shared frameworks).
      - package: MapCore
      - package: MapLayout
      - package: MapRender
      - package: CanvasKit
      - package: CanvasKit
        product: SceneExport
      - package: MapIO
    settings:
      base:
        PRODUCT_NAME: ArborTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Arbor.app/Contents/MacOS/Arbor
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Arbor:
    build:
      targets:
        Arbor: all
    test:
      targets:
        - ArborTests
